<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Add Subject</title>
</head>

<body>

<h1>Add Subject</h1>

<form method="POST">

    <label>Subject Name:</label><br>

    <input
        type="text"
        name="subject_name"
        required
    >

    <br><br>

    <label>Credits:</label><br>

    <input
        type="number"
        name="credits"
        min="1"
        max="10"
        required
    >

    <br><br>

    <button type="submit">
        Add Subject
    </button>

</form>

<br>

<a href="/subjects">
    View Subjects
</a>

</body>
</html>
