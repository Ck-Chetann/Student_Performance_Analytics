<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Edit Attendance</title>
</head>

<body>

<h1>Edit Attendance</h1>

<form method="POST">

    <label>Student:</label><br>

    <select name="student_id" required>

        {% for student in students %}

        <option
            value="{{ student.student_id }}"
            {% if student.student_id == attendance.student_id %}
            selected
            {% endif %}
        >

            {{ student.name }}

        </option>

        {% endfor %}

    </select>

    <br><br>


    <label>Subject:</label><br>

    <select name="subject_id" required>

        {% for subject in subjects %}

        <option
            value="{{ subject.subject_id }}"
            {% if subject.subject_id == attendance.subject_id %}
            selected
            {% endif %}
        >

            {{ subject.subject_name }}

        </option>

        {% endfor %}

    </select>

    <br><br>


    <label>Attendance Percentage:</label><br>

    <input
        type="number"
        name="attendance_percentage"
        value="{{ attendance.attendance_percentage }}"
        min="0"
        max="100"
        step="0.01"
        required
    >

    <br><br>

    <button type="submit">
        Update Attendance
    </button>

</form>

<br>

<a href="/attendance">
    Back to Attendance
</a>

</body>
</html>
