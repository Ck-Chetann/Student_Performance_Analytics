<!DOCTYPE html>
<html>
<head>
    <title>Edit Marks</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Edit Marks</h1>

        <form method="POST">

            <label>Student</label><br>

            <select name="student_id" required>

                {% for student in students %}

                <option
                    value="{{ student.student_id }}"
                    {% if student.student_id == mark.student_id %}selected{% endif %}
                >
                    {{ student.name }}
                </option>

                {% endfor %}

            </select>

            <br><br>

            <label>Subject</label><br>

            <select name="subject_id" required>

                {% for subject in subjects %}

                <option
                    value="{{ subject.subject_id }}"
                    {% if subject.subject_id == mark.subject_id %}selected{% endif %}
                >
                    {{ subject.subject_name }}
                </option>

                {% endfor %}

            </select>

            <br><br>

            <label>Marks</label><br>

            <input
                type="number"
                name="marks"
                value="{{ mark.marks }}"
                min="0"
                max="100"
                step="0.01"
                required
            >

            <br><br>

            <input type="submit" value="Update Marks">

            <a href="/marks">Cancel</a>

        </form>

    </div>

</div>

</body>
</html>
