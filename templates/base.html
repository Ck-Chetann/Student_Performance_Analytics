<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <title>{% block title %}Student Performance System{% endblock %}</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .navbar {
            background: #222;
            padding: 15px;
            text-align: center;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }

        .navbar a:hover {
            text-decoration: underline;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        h1, h2 {
            text-align: center;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            margin: 5px;
            text-decoration: none;
            border-radius: 5px;
            background: #333;
            color: white;
        }

    </style>

</head>

<body>

    <div class="navbar">

        <a href="/">Home</a>
        <a href="/students">Students</a>
        <a href="/subjects">Subjects</a>
        <a href="/marks">Marks</a>
        <a href="/attendance">Attendance</a>
        <a href="/performance">Performance</a>
        <a href="/dashboard">Dashboard</a>
        <a href="/prediction">ML Prediction</a>

    </div>

    <div class="container">

        {% block content %}

        {% endblock %}

    </div>

</body>

</html>
